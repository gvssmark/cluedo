<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Case File Report Generator — Cluedo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>
  :root{
    --ink:#1b2430; --ink-2:#232f3e; --parchment:#ece4d3; --parchment-dim:#cfc4a8;
    --brass:#b8935a; --brass-bright:#d9b571;
    --green:#4a7a58; --green-bright:#6fae80;
    --red:#9a3b3b; --red-bright:#c25a5a;
    --line:#3a475a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background: radial-gradient(ellipse at top left, #23303f 0%, #161d27 55%, #10151d 100%);
    color:var(--parchment); font-family: Georgia, 'Times New Roman', serif;
    padding: 24px 16px 60px;
  }
  .wrap{ max-width:980px; margin:0 auto; }
  h1{ font-size:26px; margin:0 0 4px; color:var(--parchment); font-family:'Palatino Linotype',Georgia,serif; }
  .subtitle{ font-family:'Courier New',monospace; font-size:12px; color:var(--parchment-dim); letter-spacing:.06em; margin-bottom:20px; }
  h2{ font-size:17px; color:var(--brass-bright); border-bottom:1px solid var(--line); padding-bottom:8px; margin:34px 0 14px; font-family:'Palatino Linotype',Georgia,serif; }

  .panel{
    background: linear-gradient(180deg, var(--ink-2), var(--ink)); border:1px solid var(--line);
    border-radius:6px; padding:18px 18px; margin-bottom:20px;
  }
  label{ font-size:11.5px; color:var(--parchment-dim); font-family:'Courier New',monospace; text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:6px;}
  input[type=file]{ color:var(--parchment); font-family:'Courier New',monospace; font-size:13px; }
  textarea{
    width:100%; min-height:110px; background:#111823; color:var(--parchment); border:1px solid var(--line);
    border-radius:4px; padding:9px; font-family:'Courier New',monospace; font-size:12px; resize:vertical;
  }
  button{
    background:var(--brass); color:#1b1408; border:none; border-radius:4px;
    padding:10px 16px; font-family:'Courier New',monospace; font-size:12.5px; font-weight:bold;
    letter-spacing:.05em; text-transform:uppercase; cursor:pointer; margin-top:10px; margin-right:8px;
  }
  button:hover{ background:var(--brass-bright); }
  button.secondary{ background:transparent; color:var(--brass-bright); border:1px solid var(--brass); }
  button.secondary:hover{ background:rgba(184,147,90,.15); }
  .or{ font-family:'Courier New',monospace; font-size:11px; color:var(--parchment-dim); text-transform:uppercase; letter-spacing:.08em; margin:14px 0; text-align:center; }

  .meta{ font-family:'Courier New',monospace; font-size:12.5px; color:var(--parchment-dim); background:#111823; border:1px solid var(--line); border-radius:6px; padding:12px 16px; margin-bottom:6px; }
  .meta b{ color:var(--brass-bright); }
  table{ border-collapse:collapse; width:100%; background: linear-gradient(180deg, var(--ink-2), var(--ink)); border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  th, td{ border:1px solid var(--line); padding:9px 12px; text-align:left; font-size:13.5px; vertical-align:top; }
  th{ background:#111823; color:var(--brass-bright); font-family:'Courier New',monospace; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; }
  tr:nth-child(even) td{ background:rgba(255,255,255,0.02); }
  td.turn-num{ font-family:'Courier New',monospace; color:var(--brass-bright); text-align:center; width:40px; }
  td.center{ text-align:center; font-family:'Courier New',monospace; font-size:12.5px; }
  .holds{ color:var(--green-bright); font-weight:bold; }
  .nope{ color:var(--red-bright); }
  .unk{ color:var(--parchment-dim); }
  .solution{ background:var(--green); color:#eafff0; font-weight:bold; }
  .tag-manual{ display:block; font-family:'Courier New',monospace; font-size:9.5px; color:var(--brass-bright); font-weight:normal; }
  .empty-note{ color:var(--parchment-dim); font-size:12px; font-style:italic; margin-top:8px; }
  .note{
    background: rgba(184,147,90,.12); border:1px solid var(--brass); border-radius:6px;
    padding:14px 16px; font-size:13px; margin-top:16px; line-height:1.5;
  }
  .note b{ color:var(--brass-bright); }
  .conflict-note{
    background: rgba(154,59,59,.2); border:1px solid var(--red-bright); color:#ffd9d9;
    padding:12px 16px; border-radius:6px; margin-top:16px; font-family:'Courier New',monospace; font-size:12.5px;
  }
  .error-box{
    background: rgba(154,59,59,.2); border:1px solid var(--red-bright); color:#ffd9d9;
    padding:12px 16px; border-radius:6px; margin-top:12px; font-size:13px; display:none;
  }
  .error-box.show{ display:block; }
  .solution-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .sol-card{ background:#111823; border:1px solid var(--line); border-radius:6px; padding:12px 12px; }
  .sol-card h4{ margin:0 0 8px; font-size:11px; color:var(--brass-bright); text-transform:uppercase; letter-spacing:.06em; font-family:'Courier New',monospace;}
  .sol-card .answer{ font-size:15px; color:var(--green-bright); font-weight:bold; }
  .sol-card .answer.unsolved{ color:var(--parchment-dim); font-weight:normal; font-size:12.5px; }
  footer{ text-align:center; color:var(--parchment-dim); font-size:11px; font-family:'Courier New',monospace; margin-top:40px; opacity:.6;}

  @media print{
    .panel, .no-print{ display:none !important; }
    body{ background:#fff; color:#000; padding:0; }
    h1,h2{ color:#000; }
    .subtitle{ color:#333; }
    table{ background:#fff; border-color:#999; }
    th{ background:#eee; color:#000; }
    td{ border-color:#ccc; }
    .holds{ color:#0a6b2b; }
    .nope{ color:#a33; }
    .solution{ background:#c9e8d1; color:#0a3d1c; }
    .note{ background:#fff8e6; border-color:#c9a35a; color:#000; }
  }
  @media (max-width:600px){
    .solution-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🕵️ Case File Report Generator</h1>
  <div class="subtitle">Upload or paste an exported case file to auto-build the log &amp; deduction grids</div>

  <div class="panel no-print">
    <label>Upload exported case data (.json)</label>
    <input type="file" id="fileInput" accept="application/json">
    <div class="or">— or —</div>
    <label>Paste exported JSON</label>
    <textarea id="pasteBox" placeholder="Paste the contents of your exported .json file here"></textarea>
    <div>
      <button id="loadPasteBtn">Generate report from pasted text</button>
      <button class="secondary" id="printBtn">Print / Save as PDF</button>
      <button class="secondary" id="downloadBtn">Download this report as .html</button>
    </div>
    <div class="error-box" id="errorBox"></div>
  </div>

  <div id="reportArea"></div>

  <footer>Case File Deduction Tracker — Report Generator (runs entirely in your browser; nothing is uploaded anywhere)</footer>
</div>

<script>
(function(){
  "use strict";

  const SUSPECTS = ["Miss Scarlett","Colonel Mustard","Mrs White","Reverend Green","Mrs Peacock","Professor Plum"];
  const WEAPONS  = ["Candlestick","Knife","Lead Pipe","Revolver","Rope","Wrench"];
  const ROOMS    = ["Kitchen","Ballroom","Conservatory","Dining Room","Billiard Room","Library","Lounge","Hall","Study"];
  const CATEGORIES = [
    {key:"suspect", label:"Suspects", cards:SUSPECTS},
    {key:"weapon",  label:"Weapons",  cards:WEAPONS},
    {key:"room",    label:"Rooms",    cards:ROOMS}
  ];
  const ALL_CARDS = SUSPECTS.concat(WEAPONS, ROOMS);
  const CASE = "__case__";

  const fileInput = document.getElementById("fileInput");
  const pasteBox = document.getElementById("pasteBox");
  const errorBox = document.getElementById("errorBox");
  const reportArea = document.getElementById("reportArea");

  function showError(msg){
    errorBox.textContent = msg;
    errorBox.classList.add("show");
  }
  function clearError(){
    errorBox.textContent = "";
    errorBox.classList.remove("show");
  }

  fileInput.addEventListener("change", (evt) => {
    const file = evt.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      pasteBox.value = reader.result;
      tryGenerate(reader.result);
    };
    reader.onerror = () => showError("Couldn't read that file.");
    reader.readAsText(file);
  });

  document.getElementById("loadPasteBtn").addEventListener("click", () => {
    tryGenerate(pasteBox.value);
  });

  document.getElementById("printBtn").addEventListener("click", () => window.print());

  document.getElementById("downloadBtn").addEventListener("click", () => {
    if(!reportArea.innerHTML.trim()){
      showError("Generate a report first, then you can download it.");
      return;
    }
    const styleTag = document.querySelector("style").outerHTML;
    const html = "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Case File Report</title>" + styleTag +
      "</head><body><div class='wrap'>" + reportArea.innerHTML + "</div></body></html>";
    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "cluedo-case-report-" + new Date().toISOString().slice(0,10) + ".html";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  function tryGenerate(text){
    clearError();
    if(!text || !text.trim()){
      showError("No data to read — upload a file or paste JSON text first.");
      return;
    }
    let parsed;
    try{
      parsed = JSON.parse(text);
    }catch(e){
      showError("That doesn't look like valid JSON: " + e.message);
      return;
    }
    const raw = parsed.rawState || parsed;
    if(!raw || !Array.isArray(raw.players) || !raw.players.length){
      showError("This file doesn't look like Case File export data (no players found).");
      return;
    }
    try{
      generateReport(raw);
    }catch(e){
      showError("Something went wrong building the report: " + e.message);
    }
  }

  // ---------- Deduction engine (same rules as the tracker app) ----------
  function computeFacts(state){
    const facts = {};
    const conflicts = [];
    ALL_CARDS.forEach(card => facts[card] = {});
    const columns = state.players.map((_,i)=>i).concat([CASE]);

    function colName(col){
      if(col===CASE) return "Case File";
      return state.players[col] ? state.players[col].name : ("Player "+(col+1));
    }

    function setFact(card, col, val){
      const cur = facts[card][col];
      if(cur && cur !== val){
        conflicts.push('Contradiction on "' + card + '" / ' + colName(col) + ": already " + cur + ", now trying to set " + val + ".");
        return;
      }
      facts[card][col] = val;
    }

    const manual = state.manual || {};
    Object.keys(manual).forEach(k => {
      const idxSep = k.lastIndexOf("|");
      const card = k.substring(0, idxSep);
      const colRaw = k.substring(idxSep+1);
      const col = colRaw === CASE ? CASE : parseInt(colRaw,10);
      if(ALL_CARDS.includes(card) && columns.includes(col)){
        facts[card][col] = manual[k];
      }
    });

    (state.myCards||[]).forEach(card => setFact(card, state.me, "yes"));

    const log = (state.log || []).filter(e => e.type !== "skip" && !e.deleted);
    log.forEach(e => {
      const trio = [e.suspect, e.weapon, e.room];
      (e.passed||[]).forEach(p => trio.forEach(card => setFact(card, p, "no")));
      if(e.shower !== null && e.shower !== undefined && e.knownCard){
        setFact(e.knownCard, e.shower, "yes");
      }
    });

    let orConstraints = log
      .filter(e => e.shower !== null && e.shower !== undefined && !e.knownCard)
      .map(e => ({ player: e.shower, options: [e.suspect, e.weapon, e.room] }));

    let changed = true;
    let iterations = 0;
    while(changed && iterations < 100){
      changed = false;
      iterations++;

      ALL_CARDS.forEach(card => {
        const yesCols = columns.filter(c => facts[card][c] === "yes");
        if(yesCols.length >= 1){
          columns.forEach(c => {
            if(!yesCols.includes(c) && facts[card][c] !== "no"){
              facts[card][c] = "no"; changed = true;
            }
          });
        } else {
          const noCols = columns.filter(c => facts[card][c] === "no");
          const unknownCols = columns.filter(c => facts[card][c] === undefined);
          if(noCols.length === columns.length - 1 && unknownCols.length === 1){
            facts[card][unknownCols[0]] = "yes"; changed = true;
          }
        }
      });

      CATEGORIES.forEach(cat => {
        const yesCards = cat.cards.filter(c => facts[c][CASE] === "yes");
        if(yesCards.length >= 1){
          cat.cards.forEach(c => {
            if(!yesCards.includes(c) && facts[c][CASE] !== "no"){
              facts[c][CASE] = "no"; changed = true;
            }
          });
        } else {
          const noCards = cat.cards.filter(c => facts[c][CASE] === "no");
          const unknownCards = cat.cards.filter(c => facts[c][CASE] === undefined);
          if(noCards.length === cat.cards.length - 1 && unknownCards.length === 1){
            facts[unknownCards[0]][CASE] = "yes"; changed = true;
          }
        }
      });

      state.players.forEach((p, idx) => {
        const yesCount = ALL_CARDS.filter(c => facts[c][idx] === "yes").length;
        const unknownCards = ALL_CARDS.filter(c => facts[c][idx] === undefined);
        const handSize = p.handSize || 0;
        if(yesCount >= handSize && unknownCards.length){
          unknownCards.forEach(c => { facts[c][idx] = "no"; changed = true; });
        } else if(unknownCards.length && (handSize - yesCount) === unknownCards.length){
          unknownCards.forEach(c => { facts[c][idx] = "yes"; changed = true; });
        }
      });

      const stillActive = [];
      orConstraints.forEach(con => {
        const remaining = con.options.filter(c => facts[c][con.player] !== "no");
        const alreadyYes = con.options.some(c => facts[c][con.player] === "yes");
        if(alreadyYes){ changed = true; return; }
        if(remaining.length === 1){
          facts[remaining[0]][con.player] = "yes";
          changed = true;
          return;
        }
        if(remaining.length === 0){
          conflicts.push("Unresolvable: " + colName(con.player) + " was shown one of " + con.options.join(", ") + " but all are ruled out for them.");
          return;
        }
        stillActive.push(con);
      });
      orConstraints = stillActive;
    }

    return { facts, conflicts, columns, colName };
  }

  // ---------- Plain-English log narration ----------
  function narrateEntry(e, colName){
    const passedNames = (e.passed||[]).map(colName);
    const hasShower = e.shower !== null && e.shower !== undefined;
    const cardText = hasShower ? (e.knownCard ? ('showed ' + e.knownCard) : "showed a card — which one wasn't recorded") : null;

    if(hasShower && passedNames.length === 0){
      return colName(e.shower) + " " + cardText + " right away.";
    }
    if(hasShower && passedNames.length > 0){
      return passedNames.join(", ") + " passed, then " + colName(e.shower) + " " + cardText + ".";
    }
    if(!hasShower && passedNames.length > 0){
      return passedNames.join(", ") + " passed — nobody could show a card.";
    }
    return "No one else was at the table to ask.";
  }

  // ---------- Render ----------
  function generateReport(state){
    const { facts, conflicts, colName } = computeFacts(state);
    const players = state.players;
    const me = state.me;

    let html = "";

    // Meta
    const seating = players.map((p,i)=> p.name + (i===me ? " (me)" : "") + " (" + (p.handSize||0) + " cards)").join(" → ");
    html += '<div class="meta">';
    html += '<b>Players (seating order, ' + (state.direction === "ccw" ? "anti-clockwise" : "clockwise") + '):</b> ' + seating + '<br>';
    if((state.myCards||[]).length){
      html += '<b>My cards:</b> ' + state.myCards.join(", ") + '<br>';
    }
    const manualKeys = Object.keys(state.manual||{});
    if(manualKeys.length){
      const manualDesc = manualKeys.map(k=>{
        const idxSep = k.lastIndexOf("|");
        const card = k.substring(0, idxSep);
        const colRaw = k.substring(idxSep+1);
        const col = colRaw === CASE ? CASE : parseInt(colRaw,10);
        const val = state.manual[k] === "yes" ? "holds" : "does not hold";
        return card + " — " + colName(col) + " " + val + " (manual)";
      }).join("; ");
      html += '<b>Manual notes on file:</b> ' + manualDesc;
    }
    html += '</div>';

    // Conflicts
    if(conflicts.length){
      html += '<div class="conflict-note">⚠ Logic conflict detected in this data:<br>' + conflicts.slice(0,6).map(c=>"• "+c).join("<br>") + '</div>';
    }

    // Suggestion log
    const log = state.log || [];
    const removedCount = log.filter(e => e.deleted).length;
    html += '<h2>Suggestion Log, in Plain English (newest first)</h2>';
    if(removedCount){
      html += '<div class="empty-note">' + removedCount + ' entr' + (removedCount===1?'y was':'ies were') + ' removed in the app and ' +
        (removedCount===1?'is':'are') + ' shown below struck through — excluded from all the deductions in this report.</div>';
    }
    if(!log.length){
      html += '<div class="empty-note">No suggestions logged in this file.</div>';
    } else {
      html += '<table><thead><tr><th>#</th><th>Who suggested</th><th>What they suggested</th><th>What happened</th></tr></thead><tbody>';
      for(let i = log.length - 1; i >= 0; i--){
        const e = log[i];
        const strikeOpen = e.deleted ? '<span style="text-decoration:line-through; opacity:.55;">' : '';
        const strikeClose = e.deleted ? '</span>' : '';
        const removedTag = e.deleted ? ' <span style="font-family:\'Courier New\',monospace; font-size:10px; color:var(--red-bright);">REMOVED</span>' : '';
        if(e.type === "skip"){
          html += '<tr><td class="turn-num">' + (i+1) + '</td><td>' + strikeOpen + colName(e.player) + (e.player===me?" (me)":"") + strikeClose + removedTag + '</td>' +
            '<td colspan="2">' + strikeOpen + '<em>No suggestion this turn (skipped).</em>' + strikeClose + '</td></tr>';
          continue;
        }
        html += '<tr><td class="turn-num">' + (i+1) + '</td><td>' + strikeOpen + colName(e.suggester) + (e.suggester===me?" (me)":"") + strikeClose + removedTag + '</td>' +
          '<td>' + strikeOpen + e.suspect + ', ' + e.weapon + ', ' + e.room + strikeClose + '</td>' +
          '<td>' + strikeOpen + narrateEntry(e, (c)=>colName(c)+(c===me?" (me)":"")) + strikeClose + '</td></tr>';
      }
      html += '</tbody></table>';
    }

    // Solution summary
    html += '<h2>Case File Solution (so far)</h2><div class="solution-grid">';
    CATEGORIES.forEach(cat => {
      const solved = cat.cards.find(c => facts[c][CASE] === "yes");
      const possible = cat.cards.filter(c => facts[c][CASE] !== "no");
      html += '<div class="sol-card"><h4>' + cat.label + '</h4>';
      if(solved){
        html += '<div class="answer">' + solved + '</div>';
      } else {
        html += '<div class="answer unsolved">' + possible.length + ' possibilit' + (possible.length===1?"y":"ies") + ' remain</div>';
      }
      html += '</div>';
    });
    html += '</div>';

    // Category grids
    CATEGORIES.forEach(cat => {
      html += '<h2>' + cat.label + ' — Who Holds What</h2><table><thead><tr><th>' + cat.label.slice(0,-1) + '</th>';
      players.forEach((p,i) => { html += '<th class="center">' + p.name + (i===me?" (me)":"") + '</th>'; });
      html += '<th class="center">Case File</th></tr></thead><tbody>';

      cat.cards.forEach(card => {
        html += '<tr><td>' + card + '</td>';
        players.forEach((p,i) => {
          const val = facts[card][i];
          const manualTag = (state.manual && state.manual[card+"|"+i] !== undefined) ? '<span class="tag-manual">(manual)</span>' : "";
          if(val === "yes") html += '<td class="center holds">Holds' + manualTag + '</td>';
          else if(val === "no") html += '<td class="center nope">—</td>';
          else html += '<td class="center unk">?</td>';
        });
        const caseVal = facts[card][CASE];
        if(caseVal === "yes") html += '<td class="center solution">SOLUTION</td>';
        else if(caseVal === "no") html += '<td class="center nope">—</td>';
        else html += '<td class="center unk">?</td>';
        html += '</tr>';
      });
      html += '</tbody></table>';

      const undetermined = cat.cards.filter(c => !players.some((p,i)=>facts[c][i]==="yes") && facts[c][CASE] !== "yes");
      if(undetermined.length){
        html += '<div class="empty-note">Still undetermined in ' + cat.label + ': ' + undetermined.join(", ") + '.</div>';
      }
    });

    // Hand-fill note
    const fillNote = players.map((p,i) => {
      const yesCount = ALL_CARDS.filter(c => facts[c][i] === "yes").length;
      const need = (p.handSize||0) - yesCount;
      return need > 0 ? (p.name + " needs " + need + " more") : null;
    }).filter(Boolean);
    if(fillNote.length){
      html += '<div class="note"><b>Still to place:</b> ' + fillNote.join(", ") + ' — the remaining undetermined cards above are split across these hands.</div>';
    }

    reportArea.innerHTML = html;
    reportArea.scrollIntoView({ behavior:"smooth", block:"start" });
  }
})();
</script>
</body>
</html>
